server {
    listen 8080;
    server_name _;
    root /usr/share/scummvm-web;
    absolute_redirect off;

    add_header Cache-Control $app_cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /games.json {
        alias /var/cache/scummvm/games.json;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/data/games/(?<index_path>(?:.*/)?index\.json)$ {
        alias /var/cache/scummvm/games-index/$index_path;
        add_header Cache-Control "no-cache" always;
    }

    location /data/games/ {
        alias /games/;
        disable_symlinks on;
        gzip off;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /data/ {
        gzip off;
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location /persist/ {
        alias /persist/;
        # The entrypoint rejects symlinks before enabling WebDAV. This also
        # protects reads handled by nginx's static file module.
        disable_symlinks on;
        dav_methods PUT DELETE MKCOL;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        client_max_body_size 512m;
        client_body_temp_path /persist/.upload-tmp;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
