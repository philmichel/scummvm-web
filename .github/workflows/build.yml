name: Build, test, and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'renovate.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'renovate.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      checkout_ref: ${{ github.sha }}

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: publish-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load source versions
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests/unit -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare candidate image
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "candidate=$image:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.candidate }}
          build-args: |
            SCUMMVM_DEMO_SHA=${{ env.SCUMMVM_DEMO_SHA }}
            SCUMMVM_SHA=${{ env.SCUMMVM_SHA }}
            SCUMMVM_ICONS_SHA=${{ env.SCUMMVM_ICONS_SHA }}
            EMSDK_VERSION=${{ env.EMSDK_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Fetch test game
        run: tests/fetch-fixture.sh

      - name: Pull candidate by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker pull "$IMAGE@$DIGEST"

      - name: Run smoke tests against candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: SCUMMVM_IMAGE="$IMAGE@$DIGEST" docker compose --file tests/compose.yaml run --rm smoke

      - name: Reject persistence symlinks in candidate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: SCUMMVM_IMAGE="$IMAGE@$DIGEST" tests/test-persist-symlink.sh

      - name: Stop test stack
        if: always()
        run: docker compose --file tests/compose.yaml down --volumes

      - name: Promote tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          calver=$(date -u +%Y.%-m.%-d)
          short_sha=${GITHUB_SHA::12}
          version_tags=(
            "$IMAGE:$calver-r$GITHUB_RUN_NUMBER"
            "$IMAGE:sha-$short_sha"
          )
          tag_args=()
          for tag in "${version_tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" \
            "$IMAGE@$DIGEST"

          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            mutable_tags=("$IMAGE:latest" "$IMAGE:$calver")
            docker buildx imagetools create \
              --tag "${mutable_tags[0]}" --tag "${mutable_tags[1]}" \
              "$IMAGE@$DIGEST"
          else
            echo "Skipping mutable tags because main advanced to $current_main"
            mutable_tags=()
          fi

          for tag in "${version_tags[@]}" "${mutable_tags[@]}"; do
            promoted=$(docker buildx imagetools inspect "$tag" \
              --format '{{json .Manifest}}' | jq --raw-output .digest)
            if [[ "$promoted" != "$DIGEST" ]]; then
              echo "$tag resolved to $promoted instead of $DIGEST" >&2
              exit 1
            fi
          done
